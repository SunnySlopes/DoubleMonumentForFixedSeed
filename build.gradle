import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'org.example'
version = '2.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
}

shadowJar {
    archiveBaseName.set('DoubleMonument')
    archiveClassifier.set('')
    mergeServiceFiles()
}

tasks.register('DoubleMonumentForFixedSeedJar', ShadowJar) {
    group = 'build'
    description = 'Creates a fat JAR for DoubleMonumentForFixedSeed'
    archiveBaseName.set('DoubleMonumentForFixedSeed')
    archiveClassifier.set('')
    dependsOn classes
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'project.Launcher'
    }
    mergeServiceFiles()
    exclude 'module-info.class'
}

tasks.register('buildAllJars') {
    group = 'build'
    description = 'Builds executable JAR with native libraries'
    dependsOn 'DoubleMonumentForFixedSeedJar'
}

def msys2Path() {
    def candidates = ['C:\\msys64\\ucrt64\\bin', 'C:\\msys64\\mingw64\\bin']
    return candidates.find { new File(it, 'gcc.exe').exists() } ?: ''
}

def resolveJavaHome() {
    def javaHome = System.getenv('JAVA_HOME')
    if (javaHome) {
        return new File(javaHome).absolutePath.replace('\\', '/')
    }
    def candidates = [
            'C:/Program Files/Java/jdk-17',
            'C:/Program Files/Eclipse Adoptium/jdk-17',
            'C:/Program Files/Microsoft/jdk-17'
    ]
    for (def path : candidates) {
        if (new File(path, 'bin/javac.exe').exists()) {
            return path
        }
    }
    throw new GradleException(
            'JAVA_HOME not set and no JDK 17 found. Set JAVA_HOME to your JDK directory.')
}

def nativeBuildPath() {
    def msys = msys2Path()
    def path = System.getenv('PATH')
    if (path == null) {
        path = ''
    }
    return msys ? (msys + File.pathSeparator + path) : path
}

def clearStaleCmakeCacheIfNeeded() {
    def cache = file('build/CMakeCache.txt')
    if (!cache.exists()) {
        return
    }
    def m = (cache.text =~ /CMAKE_GENERATOR:INTERNAL=(.+)/)
    if (!m.find()) {
        return
    }
    def existing = m.group(1).trim()
    if (existing != 'Ninja') {
        logger.lifecycle("Removing stale CMake cache (was '${existing}', expected 'Ninja').")
        delete(file('build/CMakeCache.txt'))
        delete(file('build/CMakeFiles'))
    }
}

tasks.register('checkNativeToolchain') {
    group = 'verification'
    description = 'Checks MSYS2 gcc/g++/ninja/cmake and JDK javac before native build'
    doLast {
        def msys = msys2Path()
        if (!msys) {
            throw new GradleException(
                    'MSYS2 MinGW not found (need C:\\msys64\\ucrt64\\bin\\gcc.exe or mingw64\\bin\\gcc.exe). ' +
                            'Install MSYS2 and run: pacman -S mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja')
        }
        ['gcc', 'g++', 'ninja', 'cmake'].each { exe ->
            if (!new File(msys, "${exe}.exe").exists()) {
                throw new GradleException("Missing ${msys}\\${exe}.exe — install via pacman.")
            }
        }
        def javaHome = resolveJavaHome()
        if (!new File(javaHome.replace('/', File.separator), 'bin/javac.exe').exists()) {
            throw new GradleException("javac not found under JAVA_HOME: ${javaHome}")
        }
    }
}

tasks.register('cmakeConfigure', Exec) {
    dependsOn checkNativeToolchain, compileJava
    group = 'build'
    description = 'Configures CMake for monumentFinderLibJ (Ninja + MinGW)'
    workingDir layout.projectDirectory.asFile
    environment 'PATH', nativeBuildPath()
    doFirst {
        clearStaleCmakeCacheIfNeeded()
    }
    def javaHome = resolveJavaHome()
    commandLine 'cmake', '-B', 'build', '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_C_COMPILER=gcc',
            '-DCMAKE_CXX_COMPILER=g++',
            "-DJAVA_HOME=${javaHome}",
            '-Wno-dev'
}

tasks.register('buildNative', Exec) {
    dependsOn cmakeConfigure
    group = 'build'
    description = 'Builds monumentFinderLibJ native library'
    workingDir layout.projectDirectory.asFile
    environment 'PATH', nativeBuildPath()
    commandLine 'cmake', '--build', 'build', '--target', 'monumentFinderLibJ', '--verbose'
    doFirst {
        if (!file('build/CMakeCache.txt').exists()) {
            throw new GradleException('CMake not configured. Check :cmakeConfigure output above.')
        }
    }
}

def generatedNativeResourcesDir = layout.buildDirectory.dir('generated/native-resources')
tasks.register('prepareNativeResources') {
    dependsOn tasks.named('buildNative')
    group = 'build'
    description = 'Collects dll/so/dylib into jar resources'
    outputs.dir(generatedNativeResourcesDir)
    doLast {
        def outDir = generatedNativeResourcesDir.get().asFile
        delete(outDir)
        outDir.mkdirs()

        def copied = false
        def buildNativeDir = file('build/native')
        if (buildNativeDir.exists()) {
            copy {
                from(buildNativeDir)
                include('*.dll', '**/*.dll')
                into(new File(outDir, 'native/windows'))
            }
            copy {
                from(buildNativeDir)
                include('libmonumentFinderLibJ.dll')
                into(new File(outDir, 'native/windows'))
                rename { 'monumentFinderLibJ.dll' }
            }
            copy {
                from(buildNativeDir)
                include('*.so', '**/*.so')
                into(new File(outDir, 'native/linux'))
            }
            copy {
                from(buildNativeDir)
                include('*.dylib', '**/*.dylib')
                into(new File(outDir, 'native/macos'))
            }
            copied = true
        }

        def nativeRoot = file('native')
        if (nativeRoot.exists()) {
            copy {
                from(nativeRoot)
                include('**/*.dll')
                into(new File(outDir, 'native/windows'))
            }
            copy {
                from(nativeRoot)
                include('**/*.so')
                into(new File(outDir, 'native/linux'))
            }
            copy {
                from(nativeRoot)
                include('**/*.dylib')
                into(new File(outDir, 'native/macos'))
            }
            copied = true
        }

        if (!copied) {
            logger.lifecycle('No native libraries found; run buildNative or place libraries under native/')
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('prepareNativeResources')
    from(generatedNativeResourcesDir)
}

tasks.named('DoubleMonumentForFixedSeedJar') {
    dependsOn tasks.named('prepareNativeResources')
}
