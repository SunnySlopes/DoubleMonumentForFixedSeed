import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'org.example'
version = '2.3'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
}

// ---------------------------------------------------------------------------
// DoubleMonumentFinderBase submodule contract
//
// All C/C++ search logic and cubiomes live in the DoubleMonumentFinderBase
// git submodule (https://github.com/SunnySlopes/DoubleMonumentFinderBase).
// This project keeps only a thin JNI shim (jni/project_MonumentFinderBridge.cpp)
// that calls the base C API from include/doublemonumentfinder/base.h.
//
// The Gradle build configures CMake with the base subdirectory, which builds
// the base static library + standalone CLI. The JNI shim is linked against the
// static library, and both the JNI DLL and the base CLI executable are packaged
// into the JAR. When the submodule (or its nested cubiomes submodule) is
// missing the build fails with an explicit instruction instead of producing a
// broken JAR.
// ---------------------------------------------------------------------------
def baseDir = file('DoubleMonumentFinderBase')
def baseHeader = new File(baseDir, 'include/doublemonumentfinder/base.h')
def baseCmake = new File(baseDir, 'CMakeLists.txt')
def baseCore = new File(baseDir, 'src/monument_search.cpp')
def baseCubiomes = new File(baseDir, 'cubiomes/generator.c')

def baseSubmoduleProblems = {
    def problems = []
    if (!baseHeader.exists()) {
        problems << "missing ${baseHeader} (DoubleMonumentFinderBase submodule not checked out)"
    }
    if (!baseCmake.exists()) {
        problems << "missing ${baseCmake} (DoubleMonumentFinderBase submodule not checked out)"
    }
    if (!baseCore.exists()) {
        problems << "missing ${baseCore} (DoubleMonumentFinderBase submodule not checked out)"
    }
    if (!baseCubiomes.exists()) {
        problems << "missing ${baseCubiomes} (nested cubiomes submodule not initialized)"
    }
    return problems
}

def requireBaseSubmodule = {
    def problems = baseSubmoduleProblems()
    if (!problems.isEmpty()) {
        throw new GradleException(
            "DoubleMonumentFinderBase submodule is not ready:\n  - " + problems.join("\n  - ") +
            "\n\nInitialize it with:\n  git submodule update --init --recursive")
    }
}

tasks.register('verifyBaseSubmodule') {
    group = 'build'
    description = 'Checks that DoubleMonumentFinderBase and its nested cubiomes are checked out'
    doLast { requireBaseSubmodule() }
}

shadowJar {
    archiveBaseName.set('DoubleMonument')
    archiveClassifier.set('')
    mergeServiceFiles()
}

tasks.register('DoubleMonumentForFixedSeedJar', ShadowJar) {
    group = 'build'
    description = 'Creates a fat JAR for DoubleMonumentForFixedSeed'
    archiveBaseName.set('DoubleMonumentForFixedSeed')
    archiveClassifier.set('')
    dependsOn classes
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'project.Launcher'
    }
    mergeServiceFiles()
    exclude 'module-info.class'
}

tasks.register('buildAllJars') {
    group = 'build'
    description = 'Builds executable JAR with native libraries and the base CLI'
    dependsOn 'DoubleMonumentForFixedSeedJar'
}

def msys2Path() {
    def candidates = ['C:\\msys64\\ucrt64\\bin', 'C:\\msys64\\mingw64\\bin']
    return candidates.find { new File(it, 'gcc.exe').exists() } ?: ''
}

def normalizeJdkHome(String value) {
    if (!value) {
        return null
    }
    def path = new File(value).absolutePath.replace('\\', '/')
    if (path.toLowerCase().endsWith('/bin')) {
        path = path.substring(0, path.length() - 4)
    }
    return path
}

def isJdkHome(String path) {
    if (!path) {
        return false
    }
    def hasJavac = new File(path, 'bin/javac.exe').exists() || new File(path, 'bin/javac').exists()
    return hasJavac && new File(path, 'include/jni.h').exists()
}

def resolveJavaHome() {
    def candidates = []
    def envHome = System.getenv('JAVA_HOME')
    if (envHome) {
        candidates << envHome
    }
    def runningJavaHome = System.getProperty('java.home')
    if (runningJavaHome) {
        candidates << runningJavaHome
    }
    candidates.addAll([
            'C:/Program Files/Java/jdk-17',
            'C:/Program Files/Eclipse Adoptium/jdk-17',
            'C:/Program Files/Microsoft/jdk-17',
            'C:/Program Files/Java/latest'
    ])
    for (def raw : candidates) {
        def path = normalizeJdkHome(raw)
        if (isJdkHome(path)) {
            return path
        }
    }
    throw new GradleException(
            'No JDK with javac and include/jni.h found. ' +
            'Set JAVA_HOME to a JDK root (not its bin subdirectory).')
}

def nativeBuildPath() {
    def msys = msys2Path()
    def path = System.getenv('PATH')
    if (path == null) {
        path = ''
    }
    return msys ? (msys + File.pathSeparator + path) : path
}

def clearStaleCmakeCacheIfNeeded() {
    def cache = file('build/CMakeCache.txt')
    if (!cache.exists()) {
        return
    }

    def expectedSource = layout.projectDirectory.asFile.absolutePath.replace('\\', '/')
    def sourceMatch = (cache.text =~ /CMAKE_HOME_DIRECTORY:INTERNAL=(.+)/)
    if (sourceMatch.find()) {
        def cachedSource = sourceMatch.group(1).trim().replace('\\', '/')
        if (cachedSource != expectedSource) {
            logger.lifecycle("Removing stale CMake cache (source '${cachedSource}' != '${expectedSource}').")
            delete(file('build/CMakeCache.txt'))
            delete(file('build/CMakeFiles'))
            return
        }
    }

    def generatorMatch = (cache.text =~ /CMAKE_GENERATOR:INTERNAL=(.+)/)
    if (!generatorMatch.find()) {
        return
    }
    def existing = generatorMatch.group(1).trim()
    if (existing != 'Ninja') {
        logger.lifecycle("Removing stale CMake cache (was '${existing}', expected 'Ninja').")
        delete(file('build/CMakeCache.txt'))
        delete(file('build/CMakeFiles'))
    }
}

tasks.register('checkNativeToolchain') {
    group = 'verification'
    description = 'Checks MSYS2 gcc/g++/ninja/cmake and JDK javac before native build'
    doLast {
        def msys = msys2Path()
        if (!msys) {
            throw new GradleException(
                    'MSYS2 MinGW not found (need C:\\msys64\\ucrt64\\bin\\gcc.exe or mingw64\\bin\\gcc.exe). ' +
                            'Install MSYS2 and run: pacman -S mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja')
        }
        ['gcc', 'g++', 'ninja', 'cmake'].each { exe ->
            if (!new File(msys, "${exe}.exe").exists()) {
                throw new GradleException("Missing ${msys}\\${exe}.exe - install via pacman.")
            }
        }
        def javaHome = resolveJavaHome()
        if (!new File(javaHome.replace('/', File.separator), 'bin/javac.exe').exists()) {
            throw new GradleException("javac not found under JAVA_HOME: ${javaHome}")
        }
    }
}

tasks.register('cmakeConfigure', Exec) {
    dependsOn 'verifyBaseSubmodule', 'checkNativeToolchain', 'compileJava'
    group = 'build'
    description = 'Configures CMake for the base library, CLI and JNI shim (Ninja + MinGW)'
    workingDir layout.projectDirectory.asFile
    environment 'PATH', nativeBuildPath()
    doFirst {
        requireBaseSubmodule()
        clearStaleCmakeCacheIfNeeded()
    }
    def javaHome = resolveJavaHome()
    commandLine 'cmake', '-B', 'build', '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_C_COMPILER=gcc',
            '-DCMAKE_CXX_COMPILER=g++',
            "-DJAVA_HOME=${javaHome}",
            '-Wno-dev'
}

tasks.register('buildNative', Exec) {
    dependsOn cmakeConfigure
    group = 'build'
    description = 'Builds DoubleMonumentFinderBase (library + CLI) and the JNI DLL'
    workingDir layout.projectDirectory.asFile
    environment 'PATH', nativeBuildPath()
    commandLine 'cmake', '--build', 'build',
            '--target', 'monumentFinderLibJ', 'DoubleMonumentFinderBase-cli',
            '--verbose'
    doFirst {
        if (!file('build/CMakeCache.txt').exists()) {
            throw new GradleException('CMake not configured. Check :cmakeConfigure output above.')
        }
    }
}

def generatedNativeResourcesDir = layout.buildDirectory.dir('generated/native-resources')
tasks.register('prepareNativeResources') {
    dependsOn tasks.named('buildNative')
    group = 'build'
    description = 'Collects the JNI DLL and base CLI into jar resources'
    outputs.dir(generatedNativeResourcesDir)
    doLast {
        def outDir = generatedNativeResourcesDir.get().asFile
        delete(outDir)
        outDir.mkdirs()

        def osName = System.getProperty('os.name', '').toLowerCase()
        def isWindowsHost = osName.contains('windows')
        def isMacHost = osName.contains('mac') || osName.contains('darwin')
        def nativeDir = file('build/native')
        def nativeLibs = isWindowsHost
            ? ['libmonumentFinderLibJ.dll', 'monumentFinderLibJ.dll']
            : (isMacHost ? ['libmonumentFinderLibJ.dylib'] : ['libmonumentFinderLibJ.so'])
        if (!nativeLibs.any { new File(nativeDir, it).exists() }) {
            throw new GradleException(
                'Missing build/native ' + nativeLibs.join('/') + '. ' +
                'Run :buildNative (it builds DoubleMonumentFinderBase first).')
        }
        def cliWindows = file('build/bin/DoubleMonumentFinderBase-cli.exe')
        def cliUnix = file('build/bin/DoubleMonumentFinderBase-cli')
        if (isWindowsHost && !cliWindows.exists()) {
            throw new GradleException(
                'Missing build/bin/DoubleMonumentFinderBase-cli.exe. ' +
                'Run :buildNative (it builds the base CLI first).')
        }
        if (!isWindowsHost && !cliUnix.exists()) {
            throw new GradleException(
                'Missing build/bin/DoubleMonumentFinderBase-cli. ' +
                'Run :buildNative (it builds the base CLI first).')
        }

        copy {
            from('build/native')
            include '*.dll'
            into(new File(outDir, 'native/windows'))
        }
        copy {
            from('build/native')
            include '*.so'
            into(new File(outDir, 'native/linux'))
        }
        copy {
            from('build/native')
            include '*.dylib'
            into(new File(outDir, 'native/macos'))
        }
        copy {
            from('build/bin')
            include 'DoubleMonumentFinderBase-cli.exe'
            into(new File(outDir, 'native/windows'))
        }
        copy {
            from('build/bin')
            include 'DoubleMonumentFinderBase-cli'
            into(new File(outDir, 'native/linux'))
        }
        copy {
            from('build/bin')
            include 'DoubleMonumentFinderBase-cli'
            into(new File(outDir, 'native/macos'))
        }

        def nativeRoot = file('native')
        if (nativeRoot.exists()) {
            copy {
                from(nativeRoot)
                include '**/*.dll'
                into(new File(outDir, 'native/windows'))
            }
            copy {
                from(nativeRoot)
                include '**/*.so'
                into(new File(outDir, 'native/linux'))
            }
            copy {
                from(nativeRoot)
                include '**/*.dylib'
                into(new File(outDir, 'native/macos'))
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('prepareNativeResources')
    from(generatedNativeResourcesDir)
    from('LICENSE')
}

tasks.named('DoubleMonumentForFixedSeedJar') {
    dependsOn tasks.named('prepareNativeResources')
}

// Bundle the base license text next to the main license.
tasks.withType(Jar).configureEach {
    from(new File(baseDir, 'LICENSE')) {
        into 'META-INF/licenses'
        rename { 'DoubleMonumentFinderBase-LICENSE.txt' }
    }
    from(new File(baseDir, 'cubiomes/LICENSE')) {
        into 'META-INF/licenses'
        rename { 'cubiomes-LICENSE.txt' }
    }
}
